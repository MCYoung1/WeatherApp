<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Stage 3 - Pick out the weather</title>
</head>
<body>
  <h1>Weather in <span id="town"></span></h1>

  <p>Weather code: <span id="weather"></span></p>
  <p>Temperature: <span id="temp"></span></p>
  <p>Recorded: <span id="time"></span></p>
  <p id="message"></p>

  <script>
    // Settings for the API
    const CONFIG = {
      town: "Brighton",
      latitude: 50.8284,
      longitude: -0.1395
    };

    // Build the API address from the settings
    function buildUrl() {
      return "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + CONFIG.latitude +
        "&longitude=" + CONFIG.longitude +
        "&current=temperature_2m,weather_code,wind_speed_10m" +
        "&timezone=Europe%2FLondon";
    }

    // Pick out the parts we want and show them, as they come
    function showWeather(data) {
      document.getElementById("town").textContent = CONFIG.town;
      document.getElementById("weather").textContent = data.current.weather_code;
      document.getElementById("temp").textContent = data.current.temperature_2m;
      document.getElementById("time").textContent = data.current.time;
    }

    // Get the data from the API, then show it
    async function loadWeather() {
      try {
        const response = await fetch(buildUrl());
        const data = await response.json();
        showWeather(data);
      } catch (error) {
        document.getElementById("message").textContent = "Could not load the weather.";
      }
    }

    // Run when the page loads
    loadWeather();
  </script>
</body>
</html>
